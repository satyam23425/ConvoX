<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ConvoX — Ultra Chat</title>
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try {
      const t = localStorage.getItem('convox-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.dataset.theme = t;
    } catch (e) { document.documentElement.dataset.theme = 'dark'; }
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Login Modal -->
  <div class="login" id="login">
    <form class="glass-card login-card" id="loginForm" autocomplete="off">
      <div class="brand-badge">
        <span>⚡ ConvoX v2</span>
      </div>
      <h1>Welcome back</h1>
      <p>Enter your alias to connect to the chat room.</p>
      
      <div class="input-wrap">
        <input id="nameInput" maxlength="20" placeholder="Choose username..." required autofocus />
      </div>
      <div class="error" id="loginError" role="alert"></div>
      <button class="btn-primary" type="submit">Connect to Space →</button>
    </form>
  </div>

  <!-- Main App View -->
  <div class="app" id="app" hidden>
    <div class="scrim" id="scrim"></div>

    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <div class="brand-title">
          <div class="logo">⚡</div>
          <strong>ConvoX</strong>
        </div>
        <button class="icon-btn" id="themeBtn" title="Toggle Theme">◐</button>
      </header>

      <nav class="nav-scroller">
        <div class="section-title">CHANNELS</div>
        <ul id="channelList"></ul>
        
        <div class="section-title">ACTIVE USERS</div>
        <ul id="userList"></ul>
      </nav>

      <footer class="me-panel" id="meBar"></footer>
    </aside>

    <main class="chat">
      <header class="chat-head">
        <button class="icon-btn menu-btn" id="menuBtn">☰</button>
        <div class="chat-info">
          <strong id="chatTitle"># general</strong>
          <span id="chatSub">Connecting...</span>
        </div>
        <div class="head-controls">
          <button class="pill-btn" id="bombToggle" title="Dissolve message after 10s">💣 Bomb</button>
        </div>
      </header>

      <div class="messages" id="messages"></div>

      <!-- Quoted Reply Banner -->
      <div class="reply-preview" id="replyPreview" hidden>
        <div class="reply-text">
          <span id="replyUser" style="font-weight:700;"></span>: <span id="replyMsg"></span>
        </div>
        <button class="icon-btn close-btn" id="cancelReply" type="button">✕</button>
      </div>

      <!-- Composer -->
      <form class="composer" id="composer" autocomplete="off">
        <div class="emoji-pop" id="emojiPop" hidden></div>
        
        <button type="button" class="icon-btn" id="emojiBtn" title="Emojis">☺</button>
        <button type="button" class="icon-btn mic-btn" id="recordBtn" title="Record Voice Note">🎙️️</button>
        
        <textarea id="input" rows="1" maxlength="2000" placeholder="Type a message or /poll..."></textarea>
        
        <button class="send-btn" type="submit" aria-label="Send">➤</button>
      </form>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
